name: macro-fetch

# Downloads macro history from FRED into qld/data/macro/ (public data, no API key).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/macro-fetch.yml", "qld/scripts/fetch_macro.py"]
  schedule:
    # weekly refresh, Sunday 00:00 UTC
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data library
        run: pip install --quiet yfinance pandas
      - name: Download macro series (FRED + Yahoo)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 qld/scripts/fetch_macro.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qld/data/macro
          git diff --cached --quiet || git commit -m "macro data: $(date -u +%Y-%m-%d)"
          git pull --rebase -q origin main || true
          git push || echo "push skipped"
